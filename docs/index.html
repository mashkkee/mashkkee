<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mashkkee</title>
  <meta name="description" content="mashkkee — interactive profile">
  <style>
    :root {
      --bg: #050506;
      --fg: #e6edf3;
      --muted: #8b949e;
      --red: #ff2e2e;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
    }
    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px 32px;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: Consolas, "Courier New", monospace;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 2px;
    }
    .top a, .links a {
      pointer-events: auto;
      color: var(--muted);
      text-decoration: none;
      transition: color .2s;
    }
    .top a:hover, .links a:hover { color: var(--red); }
    .hero h1 {
      margin: 0;
      font-family: Impact, "Arial Black", sans-serif;
      font-size: clamp(56px, 12vw, 160px);
      line-height: .9;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 40px rgba(255, 46, 46, .35);
    }
    .hero p {
      margin: 16px 0 0;
      font-family: Consolas, "Courier New", monospace;
      font-size: clamp(13px, 2vw, 18px);
      color: var(--muted);
      letter-spacing: 3px;
    }
    .hero p b { color: var(--red); font-weight: normal; }
    .links {
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
      font-family: Consolas, "Courier New", monospace;
      font-size: 14px;
      letter-spacing: 2px;
      margin-top: 28px;
    }
    .hint {
      position: fixed;
      right: 32px;
      bottom: 28px;
      font-family: Consolas, "Courier New", monospace;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 2px;
      pointer-events: none;
    }
    @media (max-width: 640px) {
      .overlay { padding: 20px; }
      .hint { display: none; }
    }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>

  <div class="overlay">
    <div class="top">
      <span>MASHKKEE // PROFILE</span>
      <a href="https://github.com/mashkkee">GITHUB ↗</a>
    </div>

    <div class="hero">
      <h1>Mashkkee</h1>
      <p>BUILD IT <b>//</b> SHIP IT <b>//</b> NO EXCUSES</p>
      <div class="links">
        <a href="https://github.com/mashkkee">GITHUB</a>
        <a href="https://github.com/mashkkee/mashkkee">THIS REPO</a>
        <a href="https://github.com/mashkkee?tab=repositories">REPOSITORIES</a>
      </div>
    </div>
  </div>

  <div class="hint">MOVE THE MOUSE &middot; CLICK TO DETONATE</div>

  <script type="module">
    import * as THREE from "three";

    const canvas = document.getElementById("scene");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 100);
    camera.position.z = 6;

    const group = new THREE.Group();
    scene.add(group);

    // Particle shell: points on a noisy sphere, each with its own outward velocity for the click burst.
    const COUNT = 3000;
    const base = new Float32Array(COUNT * 3);
    const pos = new Float32Array(COUNT * 3);
    const vel = new Float32Array(COUNT * 3);
    for (let i = 0; i < COUNT; i++) {
      const u = Math.random() * 2 - 1;
      const t = Math.random() * Math.PI * 2;
      const s = Math.sqrt(1 - u * u);
      const r = 2.4 + (Math.random() - 0.5) * 0.5;
      base[i * 3] = r * s * Math.cos(t);
      base[i * 3 + 1] = r * u;
      base[i * 3 + 2] = r * s * Math.sin(t);
      pos.set(base.subarray(i * 3, i * 3 + 3), i * 3);
    }
    const particleGeo = new THREE.BufferGeometry();
    particleGeo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    const particles = new THREE.Points(
      particleGeo,
      new THREE.PointsMaterial({ color: 0xff2e2e, size: 0.035, transparent: true, opacity: 0.85 })
    );
    group.add(particles);

    // Wireframe core.
    const core = new THREE.LineSegments(
      new THREE.WireframeGeometry(new THREE.IcosahedronGeometry(1.25, 1)),
      new THREE.LineBasicMaterial({ color: 0xff2e2e, transparent: true, opacity: 0.55 })
    );
    group.add(core);

    // Inner dark sphere so the core reads as a solid object.
    const inner = new THREE.Mesh(
      new THREE.SphereGeometry(1.1, 32, 32),
      new THREE.MeshBasicMaterial({ color: 0x0a0a0a })
    );
    group.add(inner);

    // Pointer parallax.
    const pointer = { x: 0, y: 0 };
    const target = { x: 0, y: 0 };
    window.addEventListener("pointermove", (e) => {
      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = (e.clientY / window.innerHeight) * 2 - 1;
    });

    // Click: kick every particle outward; a damped spring pulls each one back to its base position.
    const offset = new Float32Array(COUNT * 3);
    window.addEventListener("pointerdown", () => {
      for (let i = 0; i < COUNT * 3; i++) {
        vel[i] = base[i] * (1.5 + Math.random());
      }
      core.scale.setScalar(1.25);
    });

    function resize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener("resize", resize);
    resize();

    const clock = new THREE.Clock();
    function frame() {
      const dt = Math.min(clock.getDelta(), 0.05);
      const t = clock.elapsedTime;

      target.x = pointer.x * 0.6;
      target.y = pointer.y * 0.4;
      group.rotation.y += (target.x + t * 0.08 - group.rotation.y) * 0.05;
      group.rotation.x += (target.y - group.rotation.x) * 0.05;
      core.rotation.y -= dt * 0.4;

      for (let i = 0; i < COUNT * 3; i++) {
        vel[i] += (-offset[i] * 6 - vel[i] * 1.2) * dt;
        offset[i] += vel[i] * dt;
        pos[i] = base[i] + offset[i];
      }
      particleGeo.attributes.position.needsUpdate = true;
      core.scale.setScalar(core.scale.x + (1 - core.scale.x) * 0.08);

      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }

    if (reduceMotion) {
      renderer.render(scene, camera);
    } else {
      frame();
    }
  </script>
</body>
</html>
